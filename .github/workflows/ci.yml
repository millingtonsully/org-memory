name: ci

on:
  push:
    branches: [main, master]
  pull_request:

# A newer push to the same branch cancels the stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    # Minimal Settings so unit tests that touch get_settings() can construct.
    # Values are fake; verify never opens Postgres or vendor APIs.
    env:
      DATABASE_URL: postgresql+psycopg://org_memory:org_memory@localhost:5432/org_memory
      WORKSPACE_ID: ci-workspace
      SERVICE_API_KEY: ci-service-key
      EMBEDDING_API_KEY: ci-embed-key
      RERANK_API_KEY: ci-rerank-key
      OBJECT_STORE_BACKEND: supabase
      SUPABASE_PROJECT_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role
      RETENTION_DAYS: "30"
      SPEND_ALERT_TOKENS_MONTHLY: "1000"
      SPEND_HARD_LIMIT_TOKENS_MONTHLY: "2000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev,s3]"
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src
      - name: Single Alembic revision guard
        # The project keeps one squashed schema revision. A second file means
        # someone started a migration chain, which this repository forbids.
        run: |
          count=$(ls alembic/versions/*.py | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one Alembic revision, found $count"
            exit 1
          fi
      - name: Unit tests with coverage
        run: pytest -m "not integration and not postgres" -q --cov --cov-report=term --cov-report=xml
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[s3]" pip-audit
      - name: Audit dependencies for known vulnerabilities
        run: pip-audit --skip-editable

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: org_memory
          POSTGRES_PASSWORD: org_memory
          POSTGRES_DB: org_memory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U org_memory -d org_memory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://org_memory:org_memory@localhost:5432/org_memory
      WORKSPACE_ID: ci-workspace
      SERVICE_API_KEY: ci-service-key
      EMBEDDING_API_KEY: ci-embed-key
      RERANK_API_KEY: ci-rerank-key
      OBJECT_STORE_BACKEND: supabase
      SUPABASE_PROJECT_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role
      RETENTION_DAYS: 30
      SPEND_ALERT_TOKENS_MONTHLY: 1000
      SPEND_HARD_LIMIT_TOKENS_MONTHLY: 2000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,s3]"
      - name: Migrate
        run: alembic upgrade head
      - name: Migration is idempotent at head
        run: alembic upgrade head
      - name: Postgres tests
        run: pytest -m postgres -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t org-memory:ci .
      - name: Image starts and fails fast without configuration
        # Settings validate at import; the container must exit nonzero and name
        # the missing configuration instead of serving unconfigured.
        run: |
          set +e
          output=$(docker run --rm org-memory:ci 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "Container unexpectedly started without required settings"
            exit 1
          fi
          echo "$output" | grep -qi "configuration" || {
            echo "Expected a configuration error message"
            exit 1
          }
