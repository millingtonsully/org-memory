[project]
name = "org-memory"
version = "0"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "alembic>=1.13",
    "httpx>=0.27",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "prometheus_client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "boto3>=1.34",
    "moto[s3]>=5.0",
]
s3 = [
    "boto3>=1.34",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires real credentials in the environment (skipped when absent)",
    "postgres: hermetic Postgres ACL/SQL tests; require DATABASE_URL only",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",
    "UP042",
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
mypy_path = "src"
