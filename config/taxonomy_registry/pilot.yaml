# STARTER SCHEMA — not a fixed product taxonomy.
# Replace or extend the YAML in this directory for a real deployment.
# The service loads every *.yaml here (see TAXONOMY_REGISTRY_DIR); unknown
# entity types / predicates / relationship types never become active org truth.
# Instance names are free-form; entity *type* keys are closed and enforced.
#
# Bindings map to caller-platform taxonomy_key.field_key for taxonomy_proposals.
# structured_field_keys (e.g. hr.manager) are example connector field names.
version: 1
entity_types:
  - key: person
    description: Canonical person in the org graph
  - key: team
    description: Org team or group
  - key: project
    description: Named initiative or project

predicates:
  - key: title
    subject_types: [person]
    value_type: string
    mutually_exclusive: true
    structured_field_keys: [hr.title, directory.title]
    platform_binding:
      taxonomy_key: person
      field_key: title

  - key: team
    subject_types: [person]
    value_type: string
    mutually_exclusive: false
    structured_field_keys: [hr.team, directory.team]
    platform_binding:
      taxonomy_key: person
      field_key: team

  - key: reports_to
    subject_types: [person]
    value_type: reference
    mutually_exclusive: true
    structured_field_keys: [hr.manager, directory.manager]
    platform_binding:
      taxonomy_key: person
      field_key: manager

relationship_types:
  - key: reports_to
    from_types: [person]
    to_types: [person]
    mutually_exclusive: true
    description: Current manager relationship

  - key: member_of
    from_types: [person]
    to_types: [team]
    mutually_exclusive: false
    description: Team membership (multi-valued)
