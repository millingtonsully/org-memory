# Full local stack: Postgres with pgvector, one-shot migrations, API, worker.
#
#   cp .env.example .env   # fill in real keys
#   docker compose up --build
#
# The migrate service applies the single Alembic revision and exits. The API
# and worker start only after migrations succeed and Postgres is healthy.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: org_memory
      POSTGRES_PASSWORD: org_memory
      POSTGRES_DB: org_memory
    ports:
      - "5432:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U org_memory -d org_memory"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://org_memory:org_memory@postgres:5432/org_memory
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://org_memory:org_memory@postgres:5432/org_memory
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: ["python", "-m", "org_memory.workers.run"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://org_memory:org_memory@postgres:5432/org_memory
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
